[package]
name = "nomopractic"
version = "0.5.4"
edition = "2024"
description = "Low-latency HAT hardware daemon for the nomon fleet"
license = "MIT"
repository = "https://github.com/Perceptua/nomopractic"
include = ["src/**", "Cargo.toml", "README.md", "config.toml", "LICENSE"]

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "time", "io-util", "signal"] }
rppal = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
