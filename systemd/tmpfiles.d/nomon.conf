# systemd-tmpfiles configuration for nomon
# Creates /var/lib/nomon owned by the configured service user/group so the
# nomothetic service can write the pairing secret and JWT signing secret to
# this directory. deploy.sh renders ${NOMON_SERVICE_USER}/${NOMON_SERVICE_GROUP}
# via envsubst before installing this file — do not hardcode a "nomon" user
# here, since deployments may run the service as an existing OS user (e.g.
# NOMON_SERVICE_USER=perceptua) rather than a dedicated system account.
d /var/lib/nomon 0750 ${NOMON_SERVICE_USER} ${NOMON_SERVICE_GROUP} -
